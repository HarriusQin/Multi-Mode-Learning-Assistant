<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多模态学习助手</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a2e; color: #eee; height: 100vh; display: flex; flex-direction: column; }

        header { background: #16213e; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0f3460; }
        header h1 { font-size: 16px; font-weight: normal; color: #e94560; }
        #session-info { font-size: 12px; color: #888; }

        .main-container { flex: 1; display: flex; overflow: hidden; }

        .sidebar { width: 280px; background: #16213e; border-right: 1px solid #0f3460; display: flex; flex-direction: column; }
        .sidebar h3 { font-size: 12px; color: #888; padding: 12px 16px; text-transform: uppercase; letter-spacing: 1px; }

        .state-panel { padding: 0 16px 16px; }
        .state-badge { display: inline-block; padding: 4px 12px; border-radius: 16px; font-size: 13px; font-weight: 500; }
        .state-preparing { background: #4a4a6a; }
        .state-feynman { background: #2d6a4f; }
        .state-socratic { background: #7a3c3c; }
        .state-reflecting { background: #3c5a7a; }

        .progress-section { padding: 0 16px 16px; }
        .progress-section h4 { font-size: 12px; color: #888; margin-bottom: 8px; }
        #progress-display { font-size: 13px; line-height: 1.8; color: #ccc; white-space: pre-wrap; }

        .todo-section { flex: 1; overflow-y: auto; padding: 0 16px 16px; }
        .todo-section h4 { font-size: 12px; color: #888; margin-bottom: 8px; }
        #todo-list-display { font-size: 13px; line-height: 1.8; color: #ccc; }
        .todo-item { padding: 4px 0; display: flex; align-items: center; gap: 8px; }
        .todo-item.completed { text-decoration: line-through; color: #666; }
        .todo-status { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #555; display: inline-block; }
        .todo-item.completed .todo-status { background: #2d6a4f; border-color: #2d6a4f; }

        .chat-area { flex: 1; display: flex; flex-direction: column; }
        .chat-header { padding: 12px 20px; background: #16213e; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 16px; font-size: 13px; }
        .model-selector { display: flex; align-items: center; gap: 8px; }
        .model-selector select { background: #1a1a2e; border: 1px solid #0f3460; color: #eee; padding: 6px 10px; border-radius: 6px; font-size: 13px; }

        .messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
        .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; }
        .message.user { align-self: flex-end; background: #0f3460; }
        .message.assistant { align-self: flex-start; background: #16213e; border: 1px solid #0f3460; }
        .message.tool { align-self: flex-start; background: #1f1f3a; border: 1px dashed #3a3a5a; font-size: 12px; color: #888; }
        .message-meta { font-size: 11px; color: #555; margin-top: 4px; }

        .input-area { padding: 16px 20px; background: #16213e; border-top: 1px solid #0f3460; display: flex; gap: 12px; }
        .input-area input { flex: 1; background: #1a1a2e; border: 1px solid #0f3460; color: #eee; padding: 12px 16px; border-radius: 8px; font-size: 14px; outline: none; }
        .input-area input:focus { border-color: #e94560; }
        .input-area button { background: #e94560; border: none; color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; cursor: pointer; transition: background 0.2s; }
        .input-area button:hover { background: #ff6b6b; }
        .input-area button:disabled { background: #555; cursor: not-allowed; }

        .state-transition { font-size: 12px; color: #e94560; padding: 8px 16px; background: #1f1f3a; border-radius: 8px; margin-bottom: 16px; }

        .error-msg { color: #ff6b6b; font-size: 13px; }

        .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid #555; border-top-color: #e94560; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <header>
        <h1>多模态学习助手</h1>
        <div id="session-info">未连接</div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <h3>当前状态</h3>
            <div class="state-panel">
                <span id="current-state" class="state-badge state-preparing">preparing</span>
            </div>

            <div class="progress-section">
                <h4>进度追踪</h4>
                <div id="progress-display">尚未初始化</div>
            </div>

            <div class="todo-section">
                <h4>知识点</h4>
                <div id="todo-list-display">尚未初始化</div>
            </div>
        </div>

        <div class="chat-area">
            <div class="chat-header">
                <div class="model-selector">
                    <label>模型:</label>
                    <select id="model-select">
                        <option value="">使用默认配置</option>
                    </select>
                </div>
            </div>

            <div id="messages" class="messages">
                <div class="message assistant">
                    欢迎使用多模态学习助手。请在上方输入您的讨论主题。
                    <div class="message-meta">系统</div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="message-input" placeholder="输入消息..." onkeydown="if(event.key==='Enter'&&!event.shiftKey)sendMessage()">
                <button id="send-btn" onclick="sendMessage()">发送</button>
            </div>
        </div>
    </div>

    <script>
        let sessionId = null;
        let loading = false;

        async function initSession() {
            const res = await fetch('/api/init', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({}) });
            const data = await res.json();
            sessionId = data.session_id;
            updateState(data.current_state);
            document.getElementById('session-info').textContent = `会话: ${sessionId.slice(0,8)}... | 模型: ${data.model}`;
            await refreshProgress();
            await refreshTodo();
        }

        async function refreshProgress() {
            if (!sessionId) return;
            const res = await fetch('/api/progress', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ session_id: sessionId }) });
            const data = await res.json();
            document.getElementById('progress-display').textContent = data.progress || '暂无数据';
        }

        async function refreshTodo() {
            if (!sessionId) return;
            const res = await fetch('/api/todo', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ session_id: sessionId, action: 'list' }) });
            const data = await res.json();
            const output = parseTodoList(data.result);
            document.getElementById('todo-list-display').innerHTML = output || '暂无知识点';
        }

        function parseTodoList(text) {
            if (!text || !text.includes('===')) return '';
            const lines = text.split('\n').slice(1);
            return lines.map(line => {
                if (line.startsWith('完成:')) {
                    return `<div>${line}</div>`;
                }
                if (line.includes('待完成:')) {
                    return `<div>${line}</div>`;
                }
                if (line.includes('主题:')) {
                    return `<div>${line}</div>`;
                }
                return '';
            }).join('');
        }

        function updateState(state) {
            document.getElementById('current-state').textContent = state;
            document.getElementById('current-state').className = `state-badge state-${state}`;
        }

        function addMessage(role, content, meta) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            div.innerHTML = content + (meta ? `<div class="message-meta">${meta}</div>` : '');
            document.getElementById('messages').appendChild(div);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        function setLoading(on) {
            loading = on;
            document.getElementById('send-btn').disabled = on;
            document.getElementById('message-input').disabled = on;
        }

        async function sendMessage() {
            if (loading) return;
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            if (!message) return;
            if (!sessionId) await initSession();

            input.value = '';
            addMessage('user', message);
            setLoading(true);

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ session_id: sessionId, message })
                });
                const data = await res.json();
                addMessage('assistant', data.response);
                updateState(data.current_state);
                await refreshProgress();
                await refreshTodo();
            } catch (e) {
                addMessage('assistant', `<span class="error-msg">错误: ${e.message}</span>`);
            } finally {
                setLoading(false);
            }
        }

        initSession();
    </script>
</body>
</html>
